<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>argdown-preview</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header>
      <span id="file">waiting for helix…</span>
      <span class="actions">
        <button id="hide" title="Hide the selected node or group, with what supports or attacks it (h)" disabled>Hide</button>
        <button id="hidden" title="Show what you hid" hidden>Hidden</button>
        <button id="legend" title="Show or hide what the colours mean (l)">Legend</button>
        <button id="theme" title="Switch between light, dark and following the system">Light</button>
        <button id="fit" title="Fit the map to the window (f)">Fit</button>
        <button id="export" title="Download the map as SVG">SVG</button>
      </span>
      <div id="hidden-list" hidden></div>
    </header>
    <div id="errors" hidden></div>
    <div id="map-area">
      <div id="map"></div>
      <div id="legend-panel" hidden></div>
    </div>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
